name: Axi CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
      - 'feature/**'
      - 'debug/**'
      - 'hotfix/**'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  baseline:
    name: Baseline
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run package checks
        run: |
          run_if_script() {
            local script_name="$1"
            if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts[process.argv[1]] ? 0 : 1)" "$script_name"; then
              pnpm "$script_name"
            else
              echo "skip missing script: $script_name"
            fi
          }
          run_if_script governance:check
          run_if_script lint
          run_if_script test
          run_if_script build

      - name: Source lock age advisory
        run: |
          if node -e "const p=require('./package.json'); process.exit(p.scripts && p.scripts['source:age'] ? 0 : 1)" 2>/dev/null; then
            echo "::group::source:age (advisory; warn-only)"
            pnpm source:age || echo "::warning title=source lock drift::source:age reported drift above thresholds; review sources.lock.json and update if intentional"
            echo "::endgroup::"
          else
            echo "skip missing script: source:age"
          fi





      - name: Tracked secret filename guard
        working-directory: .
        run: |
          if git ls-files | grep -Ei '(^|/)(\.env$|.*private[_-]?key.*|.*service-account.*\.json$|.*credential.*\.json$)'; then
            echo "Tracked secret-like filename found."
            exit 1
          fi
